# HLint configuration for the VoLCA engine.
#
# Its presence activates the hlint step in CI, which otherwise skips when no config is
# found. Run locally with: hlint src app test
#
# The partial functions are banned separately, over src and app alone, by
# `.hlint-partials.yaml`: hlint reads one configuration per invocation, and that ban
# is not the test suite's. Run it too:
#
#     hlint --hint=.hlint-partials.yaml --only="Avoid restricted function" src app
#
# Never pass both files to one invocation: this file ignores the restriction's
# hint name globally, so together they switch the ban off.
#
# The hygiene pass either *fixes* a hint or *baselines* it here with a one-line reason.
# src, app and test are all hint-clean; the baselines below are deliberate exceptions
# where the suggested rewrite conflicts with a stronger rule (code safety, the
# formatter, or the point of the test).

# fourmolu's `single-constraint-parens: always` writes `(HasCallStack) =>`, which hlint
# reads as a redundant bracket. The formatter wins, so silence the lint on these
# helpers - both carry the constraint so a failed assertion points at its call site
# rather than at the helper.
- ignore: {name: "Redundant bracket", within: [SimaProParserSpec.findByName, SimaProParserSpec.shouldEvalTo]}

# This test's whole point is the right-identity law `s <> mempty`; hlint would simplify
# it to `s` and delete exactly what's under test. Keep the law spelled out.
- ignore: {name: "Monoid law, right identity", within: LoaderSpec}

# ---------------------------------------------------------------------------
# A key read out of a file can repeat
# ---------------------------------------------------------------------------
#
# `M.fromList` keeps the last row of a repeated key and says nothing. An index
# asserts that its key determines its value, so where the key comes out of a
# file - which nothing makes a primary key - one of three answers has to be
# chosen and said: refuse (`Data.Indexing.uniqueIndex`), keep all
# (`fromListWith` towards a `NonEmpty`), or reconcile.
#
# The restriction is scoped to the modules listed below: the parsers of the five
# formats the engine reads, the tables it ships, and the two that index a
# directory of files. It is not every module that opens a file, and the sites in
# the others are unguarded.
#
# It takes three steps because every `functions:` restriction shares the hint
# name "Avoid restricted function": the ban is global, the hint is then ignored
# everywhere, and re-raised as an error in the modules below. Another
# `functions:` restriction added here later inherits that scoping and will NOT
# fire outside this list - extend the list with it, or give it a file of its own
# read through `--hint`, which is what `.hlint-partials.yaml` does. A `modules:`
# or `extensions:` restriction carries its own hint name and is unaffected.
- functions:
    - name: Data.Map.fromList
      within: []
      message: "a key read out of a file can repeat, and this keeps the last row in silence: refuse (Data.Indexing.uniqueIndex), keep all (fromListWith towards a NonEmpty), or reconcile - and say which"
    - name: Data.Map.Strict.fromList
      within: []
      message: "a key read out of a file can repeat, and this keeps the last row in silence: refuse (Data.Indexing.uniqueIndex), keep all (fromListWith towards a NonEmpty), or reconcile - and say which"
    - name: Data.Map.Lazy.fromList
      within: []
      message: "a key read out of a file can repeat, and this keeps the last row in silence: refuse (Data.Indexing.uniqueIndex), keep all (fromListWith towards a NonEmpty), or reconcile - and say which"
- ignore: {name: "Avoid restricted function"}
- error:
    name: "Avoid restricted function"
    within:
      [ BrightwayExcel.Parser
      , Config
      , Database.Loader
      , EcoSpold.Parser1
      , EcoSpold.Parser2
      , ILCD.Common
      , ILCD.Parser
      , Method.FlowResolver
      , Method.ParserCSV
      , Method.ParserNW
      , Method.Types
      , SimaPro.Parser
      , UnitConversion
      ]

# The sites in those modules where the key does determine its value, each with
# what makes that true. A line here is the comment, and unlike a comment it does
# not travel with the code: move the site into another function and the error
# fires there. hlint does not check that the function named still exists, so a
# baseline whose site has gone stays until someone removes it.

# Keys written in this file: the configuration schema, the four units the engine
# starts with, the two classification cells an EcoSpold 1 dataset carries, the
# ones a SimaPro block carries.
- ignore: {name: "Avoid restricted function", within: [Config.configKeys, UnitConversion.defaultUnitConfig, EcoSpold.Parser1.buildResult, SimaPro.Parser.processBlockToActivity, SimaPro.Parser.productToExchange]}

# Keys walked out of a `Map`, so unique before the list is built: the ILCD flow
# and unit-group tables, and the groups `latestByUUID` has just formed.
- ignore: {name: "Avoid restricted function", within: [ILCD.Parser.buildFlowAndUnitDB, ILCD.Common.latestByUUID]}

# A unit identifier minted from the unit's name, by a UUIDv5 over that name, for
# a value whose every field is that same name. Two rows under one identifier are
# the same unit.
- ignore: {name: "Avoid restricted function", within: [BrightwayExcel.Parser.parseBrightwayExcel, SimaPro.Parser.parseSimaProCSV]}

# The units of one EcoSpold dataset, whose identifiers come from the file rather
# than from the name. An identifier the file gives two names is refused by
# `unitNamesDisagreeing` before the load returns, so what this table holds under
# a repeated identifier never reaches an answer.
- ignore: {name: "Avoid restricted function", within: Database.Loader.allocateParsed}

# Keys a file format makes unique within the part they are read from: a
# relationship identifier in a workbook's rels part, a column index within one
# row.
- ignore: {name: "Avoid restricted function", within: [BrightwayExcel.Parser.readSheets, BrightwayExcel.Parser.parseRow]}

# The repeat is answered a few lines above, and this builds the table once the
# answer is known: the compartment and energy-density tables refuse it, and the
# workbook block refuses a metadata key answered two ways.
- ignore: {name: "Avoid restricted function", within: [Method.Types.buildEnergyDensityMapFromCSV, BrightwayExcel.Parser.metaOf]}

# Two sites, two reasons. `added` is one declaration per unit name by
# construction, three lines above it. `shippedReference` is keyed on a dimension,
# which every spelling of that dimension shares, and each of them looks up the
# same canonical name, so the repeated keys carry equal values.
- ignore: {name: "Avoid restricted function", within: UnitConversion.addDeclaredUnits}

# `rowFields` keys a data row on its column label, and the labels a header row
# spells more than once are reported beside it by `duplicateLabels`: one column
# of each survives per row, and the reader is told which.
- ignore: {name: "Avoid restricted function", within: BrightwayExcel.Parser.rowFields}

# The dataset key of a harvest is the (activity, product) pair its source names
# the dataset under, and which of two datasets under one pair survives is the
# harvest's own stated law, the one its type documents and "LoaderSpec" pins for
# the tables beside this one.
- ignore: {name: "Avoid restricted function", within: Database.Loader.harvestOf}

# A process is keyed on the pair (process, its reference product), and allocation
# gives one activity per product-output exchange, so the pair separates the
# coproducts of one process. Two output exchanges naming one product flow would
# land on one pair; nothing here would say so.
- ignore: {name: "Avoid restricted function", within: ILCD.Parser.buildActivityMap}

# SimaPro states its parameters in groups of rising precedence - database, then
# project, then process - and a name stated in two of them is meant to take the
# last, which is what this does and what the function documents. A name stated
# twice inside one group takes the last as well, and that the format does not
# settle: the two maps returned here agree on it, and neither says it.
- ignore: {name: "Avoid restricted function", within: SimaPro.Parser.buildParamEnv}

# A database name held by two entries is reported at discovery, and this keeps
# the same one the manager's own registry keeps, so the load order and the
# registry agree. `inDeg` is keyed over a list that came out of a `Set`.
- ignore: {name: "Avoid restricted function", within: Config.resolveLoadOrder}
