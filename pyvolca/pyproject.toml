[project]
name = "pyvolca"
version = "0.12.0"
description = "Python client for VoLCA, the Life Cycle Assessment engine"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [{name = "Christophe Combelles", email = "ccomb@free.fr"}]
dependencies = [
    "requests>=2.28",
    "platformdirs>=4.0",
    # server.py reads the engine TOML; tomllib is only in the standard library from 3.11.
    "tomli>=2.0; python_version < '3.11'",
]
keywords = [
    "lca",
    "life-cycle-assessment",
    "life-cycle-inventory",
    "lcia",
    "environmental-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    # No License classifier: the SPDX `license` field above supersedes it, and
    # setuptools refuses a build that carries both (PEP 639).
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest", "pyright==1.1.411"]

[project.urls]
Documentation = "https://www.volca.run/docs/python/"
Changelog = "https://github.com/ccomb/volca/blob/main/pyvolca/CHANGELOG.md"
Repository = "https://github.com/ccomb/volca/tree/main/pyvolca"
Issues = "https://github.com/ccomb/volca/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src/volca"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
