name: Build matrix

# Reusable workflow consumed by build.yml (PR trigger) and release.yml
# (tag trigger). Single source of truth for the 4-platform build steps.
#
# `release: true` switches the upload from a raw binary (used by build.yml
# for debugging) to a versioned tarball/zip (consumed by release.yml's
# publish job).

on:
  workflow_call:
    inputs:
      release:
        description: When true, package the binary as volca-<version>-<name>.{tar.gz,zip} for release publishing.
        type: boolean
        default: false

# Read-only token: this workflow only checks out the repo and downloads
# from public release artifacts. Publishing to releases is done by the
# callers (release.yml, prebuild-*.yml) under their own elevated scope.
permissions:
  contents: read

jobs:
  # Detect pyvolca-only PRs so the heavy build can no-op while still
  # reporting `build / <platform>` as success. Branch protection's
  # required-check list does not honour `paths-ignore`: a workflow that
  # never runs leaves the check pending, blocking merge forever. The
  # only safe way to skip the build is to keep the job running and
  # short-circuit every step inside it – that is what `skip=true`
  # signals to the matrix below.
  preflight:
    name: Detect pyvolca-only diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.s.outputs.skip }}
    steps:
      - id: s
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          # Compare via API instead of a heavyweight fetch – we only need
          # filenames. Empty list (e.g. compare across unrelated histories)
          # falls through to skip=false to stay on the safe side.
          changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base}...${head}" --jq '.files[].filename' 2>/dev/null || true)
          if [[ -z "$changed" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qvE '^pyvolca/'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pyvolca-only diff – build matrix will report success without compiling."
          fi

  # Single source of truth for toolchain pins. Each downstream job
  # references needs.versions.outputs.* so a versions.env edit propagates
  # everywhere without touching workflow YAML.
  versions:
    name: Read pinned versions
    runs-on: ubuntu-latest
    outputs:
      alpine: ${{ steps.r.outputs.alpine }}
      macos_target: ${{ steps.r.outputs.macos_target }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          source versions.env
          echo "alpine=alpine:$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "macos_target=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [preflight, versions]
    runs-on: ${{ matrix.runner }}
    # Linux jobs run in an Alpine container so the released binary links
    # against musl libc – truly portable across distros (vs. glibc-static,
    # which leaks dlopen/getaddrinfo and forces ABI-specific shims). Windows/macOS
    # keep running on the bare runner – GH macOS hosts cannot run containers,
    # and Windows uses MSYS2 instead of a Linux container. Empty string ⇒
    # no container; GHA accepts that idiom for conditionally-containerized jobs.
    container: ${{ matrix.os == 'linux' && needs.versions.outputs.alpine || '' }}
    # Catches genuine hangs without false-failing legitimate cold builds.
    # Windows cold path (MSYS2 + GHCup install + cold cabal compile + 25-min
    # test step) tops out around 50 min; 60 min gives ~10 min headroom while
    # still being well under GH's default 360-min cap.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            os: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - name: windows-amd64
            runner: windows-latest
            os: windows
          - name: macos-arm64
            runner: macos-15
            os: macos
          # Intel macOS via GitHub's last x86_64 hosted label. GitHub retires
          # x86_64 macOS entirely in Aug 2027 – migrate to arm64-only or a
          # self-hosted Intel runner before then.
          - name: macos-intel
            runner: macos-15-intel
            os: macos
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ needs.versions.outputs.macos_target }}
      # The MSYS2 ucrt64 runtime volca.exe loads. Named once because two steps
      # need the same list: the per-PR check that they exist, and the release
      # packaging that copies them into the zip. A rename upstream (a gcc major
      # bump moving libgcc_s_seh-1, say) then fails on the PR that first sees
      # it, not at tag time.
      WINDOWS_RUNTIME_DLLS: >-
        libgfortran-5.dll libquadmath-0.dll libgcc_s_seh-1.dll
        libwinpthread-1.dll libstdc++-6.dll libgomp-1.dll libopenblas.dll
      # Skip the brew formula refresh and post-install cleanup on every
      # invocation – the runner image is ephemeral, the disk savings
      # do not matter, and the refresh alone can add 30-60s.
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      # Surfaces the no-op in the job log when the preflight has decided
      # this is a pyvolca-only PR. Every step below is gated on
      # `needs.preflight.outputs.skip != 'true'` so the job lands as
      # "success" with no real work done – satisfies the four required
      # `build / <platform>` checks without paying the cold compile.
      - name: Pyvolca-only PR – skipping Haskell build
        if: needs.preflight.outputs.skip == 'true'
        # POSIX `sh` here – bash is not preinstalled in the Alpine container
        # used by the Linux matrix rows, and this skip step runs before
        # setup-haskell-env (which apk-installs bash) had a chance to run.
        shell: sh
        run: echo "::notice::Pyvolca-only diff (per preflight); reporting success without building."

      # GitHub's JavaScript actions (checkout, cache, …) ship a glibc-linked
      # Node binary which refuses to run in an Alpine container on ARM64
      # ("JavaScript Actions in Alpine containers are only supported on x64
      # Linux runners"). This composite action drops a patched gcompat shim
      # into /lib and masks /etc/os-release so the runner stops detecting
      # Alpine. The action's own `runner.arch == 'ARM64'` guard makes it a
      # no-op on amd64. Every Linux matrix row runs in Alpine; future
      # non-Alpine Linux rows would need a separate selector.
      - if: needs.preflight.outputs.skip != 'true' && matrix.os == 'linux'
        uses: laverdet/alpine-arm64@v1
      - if: needs.preflight.outputs.skip != 'true'
        uses: actions/checkout@v4

      # POSIX `sh` here – bash isn't preinstalled in the Alpine container
      # we now use for Linux jobs (setup-haskell-env apk-installs it below).
      # All the work these two steps do is POSIX-compatible already.
      - name: Read pinned versions
        id: versions
        if: needs.preflight.outputs.skip != 'true'
        shell: sh
        run: |
          # `./` so dash (Ubuntu /bin/sh) doesn't PATH-search for the file –
          # POSIX `.` builtin only skips PATH when the operand contains a slash.
          # Alpine's BusyBox ash is more lenient but the slash form works for both.
          . ./versions.env
          echo "ghc=$GHC_VERSION" >> "$GITHUB_OUTPUT"
          echo "mumps=$MUMPS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read engine version from cabal
        id: cabal-version
        if: needs.preflight.outputs.skip != 'true'
        shell: sh
        run: |
          ver=$(awk '/^version:/ {print $2; exit}' volca.cabal)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Setup Haskell build environment
        id: setup-haskell
        if: needs.preflight.outputs.skip != 'true'
        uses: ./.github/actions/setup-haskell-env
        with:
          matrix-os: ${{ matrix.os }}
          matrix-name: ${{ matrix.name }}
          ghc-version: ${{ steps.versions.outputs.ghc }}
          install-upx: 'true'
          cache-ghcup: 'true'

      # MUMPS sourcing has three layers, tried in order:
      #
      #  1. Download a prebuilt archive from the matching `mumps-prebuilt-*`
      #     GH Release. This is the fast path – populated once per
      #     (MUMPS_VERSION, MUMPS_PREBUILT_REVISION) tuple by
      #     `prebuild-mumps.yml`, downloaded in ~5 s here. Everyone benefits
      #     including cold-cache runs.
      #  2. GH Actions cache (`deps/mumps` keyed on MUMPS_VERSION +
      #     hashFiles('build-mumps.sh')). Salvages a previous source build
      #     within the 7-day cache eviction window if step 1 missed.
      #  3. Source build via `build-mumps.sh` (build.sh's existing fallback).
      #     Only runs if both 1 and 2 missed – typically right after a
      #     MUMPS_VERSION/REVISION bump where the prebuilt release does not
      #     exist yet.
      #
      # build.sh's MUMPS detection at src ~line 282 prefers
      # $LOCAL_MUMPS_DIR/lib/libdmumps_seq.a when present, so any of the
      # three paths populating deps/mumps/ is picked up automatically.

      - name: Download prebuilt MUMPS (if release exists)
        id: download-mumps
        if: needs.preflight.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source versions.env
          # Retry `gh release view` so a transient API hiccup isn't read as a
          # missing asset. Prints the asset list (rc 0) on a successful query;
          # rc 1 only when every attempt failed (API error or release absent).
          # Kept identical in the cabal-store probe step below.
          gh_list_assets() {
            local tag="$1" out
            for attempt in 1 2 3; do
              if out=$(gh release view "$tag" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null); then
                printf '%s\n' "$out"; return 0
              fi
              echo "::notice::Querying release $tag failed (attempt $attempt/3) – retrying in 4s" >&2
              sleep 4
            done
            return 1
          }
          TAG="mumps-prebuilt-${MUMPS_VERSION}-r${MUMPS_PREBUILT_REVISION:-1}"
          PLATFORM='${{ matrix.name }}'
          ASSET="mumps-prebuilt-${PLATFORM}.tar.gz"
          # Probe the asset, not just the release: a newly-added platform's
          # asset may be absent from an existing release (e.g. first macos-intel
          # build before prebuild-mumps.yml has published its tarball). Missing
          # asset → fall through to the source build instead of failing here.
          #
          # Distinguish a genuine absence from a transient API failure: piping
          # `gh ... 2>/dev/null` straight into grep conflates the two, so a
          # flaky `gh release view` silently downgraded the job to the slow
          # source build even when the asset existed (observed on macos-arm64
          # against a release that had it). Retry the query; only a *successful*
          # query with the asset missing is a real miss.
          if ! assets=$(gh_list_assets "$TAG"); then
            echo "::warning::Could not query release $TAG after retries (API error or release absent) – falling back to source build (or cache)."
            echo "populated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx "$ASSET" <<<"$assets"; then
            echo "::warning::Prebuilt MUMPS asset $ASSET (tag $TAG) absent on the release – falling back to source build (or cache). Trigger prebuild-mumps.yml to populate."
            echo "populated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Download into a step-local dir so this step's SHA256SUMS doesn't
          # collide with the one downloaded by the cabal-store step below.
          DL=mumps-dl
          rm -rf "$DL" && mkdir -p "$DL"
          gh release download "$TAG" -R "${GITHUB_REPOSITORY}" -p "$ASSET" -p SHA256SUMS -D "$DL"
          (cd "$DL" && grep " $ASSET\$" SHA256SUMS | sha256sum -c -)
          mkdir -p deps
          tar xzf "$DL/$ASSET" -C deps
          test -f deps/mumps/lib/libdmumps_seq.a
          rm -rf "$DL"
          echo "Prebuilt MUMPS $TAG/$ASSET extracted to deps/mumps/"
          echo "populated=true" >> "$GITHUB_OUTPUT"

      # Cache restore + save are split (instead of using actions/cache@v4
      # with save-always, which is deprecated). The save step runs with
      # `if: always()` so a downstream test failure or hang does not
      # discard a 30-min cold cabal compile that did succeed.

      - name: Restore MUMPS local build (fallback when prebuilt missing)
        id: cache-mumps
        if: needs.preflight.outputs.skip != 'true' && steps.download-mumps.outputs.populated != 'true'
        uses: actions/cache/restore@v4
        with:
          path: deps/mumps
          # Hashing build-mumps.sh in addition to MUMPS_VERSION so an edit
          # to the build recipe invalidates the cache (e.g., new gfortran
          # detection logic, additional flags). Without this the old build
          # is silently reused even when its inputs no longer match.
          key: mumps-${{ matrix.name }}-${{ steps.versions.outputs.mumps }}-${{ hashFiles('build-mumps.sh') }}

      # Cabal store sourcing has the same three layers as MUMPS above:
      #   1. Download from the matching `cabal-store-prebuilt-*` GH Release
      #      (~30 s). Populated by `prebuild-cabal-store.yml` once per
      #      (volca.cabal+mumps-hs.cabal+cabal.project, GHC, REV) tuple.
      #      Carries only ~/.cabal/store – dist-newstyle is per-PR and
      #      always rebuilt incrementally on top.
      #   2. Existing actions/cache restore (~/.cabal/store + dist-newstyle).
      #      Salvages a previous source build within the 7-day window.
      #   3. Cabal builds deps from scratch (~10–20 min, the cold path).

      - name: Download prebuilt cabal store (if release exists)
        id: download-cabal
        if: needs.preflight.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source versions.env
          # Retry `gh release view` so a transient API hiccup isn't read as a
          # missing asset (see the MUMPS step above – kept identical here).
          gh_list_assets() {
            local tag="$1" out
            for attempt in 1 2 3; do
              if out=$(gh release view "$tag" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null); then
                printf '%s\n' "$out"; return 0
              fi
              echo "::notice::Querying release $tag failed (attempt $attempt/3) – retrying in 4s" >&2
              sleep 4
            done
            return 1
          }
          # Hash matches the prebuild-cabal-store.yml publish step exactly,
          # so a content change in any of these files always misses the
          # prebuilt and falls through to the cache + source build path.
          # volca.cabal's version/synopsis/description are stripped: they
          # never affect the dependency closure, so a release bump must NOT
          # invalidate the store (otherwise every `vX.Y.Z` PR forces a full
          # 5-platform re-prebuild). Keep this filter identical in both files.
          HASH8=$( { grep -vE '^(version|synopsis|description):' volca.cabal; cat mumps-hs/mumps-hs.cabal cabal.project; } | sha256sum | cut -c1-8)
          REV="${CABAL_PREBUILT_REVISION:-1}"
          TAG="cabal-store-prebuilt-ghc${GHC_VERSION}-${HASH8}-r${REV}"
          PLATFORM='${{ matrix.name }}'
          ASSET="cabal-store-${PLATFORM}.tar.gz"
          # Probe the asset, not just the release (see MUMPS step): a newly-added
          # platform's asset may be missing from an existing release. Missing
          # asset → fall through to the source build instead of failing here.
          if ! assets=$(gh_list_assets "$TAG"); then
            echo "::warning::Could not query release $TAG after retries (API error or release absent) – falling back to source build (or cache)."
            echo "populated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qx "$ASSET" <<<"$assets"; then
            echo "::warning::Cabal-store prebuilt asset $ASSET (tag $TAG) absent on the release – falling back to source build (or cache). Trigger prebuild-cabal-store.yml to populate."
            echo "populated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Download into a step-local dir to avoid SHA256SUMS collision with
          # the MUMPS download step above.
          DL=cabal-dl
          rm -rf "$DL" && mkdir -p "$DL"
          gh release download "$TAG" -R "${GITHUB_REPOSITORY}" -p "$ASSET" -p SHA256SUMS -D "$DL"
          (cd "$DL" && grep " $ASSET\$" SHA256SUMS | sha256sum -c -)
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p /c/cabal
            tar xzf "$DL/$ASSET" -C /c/cabal
            test -d /c/cabal/store
          else
            mkdir -p "$HOME/.cabal"
            tar xzf "$DL/$ASSET" -C "$HOME/.cabal"
            test -d "$HOME/.cabal/store"
          fi
          rm -rf "$DL"
          echo "Prebuilt cabal store $TAG/$ASSET extracted."
          echo "populated=true" >> "$GITHUB_OUTPUT"

      - name: Restore Cabal store
        id: cache-cabal
        if: needs.preflight.outputs.skip != 'true' && steps.download-cabal.outputs.populated != 'true'
        uses: actions/cache/restore@v4
        with:
          # GHCup-installed cabal on Windows uses C:\cabal\store, not the
          # MSYS2 ~/.cabal/store path. Listing both is safe – actions/cache
          # silently skips paths that do not exist on the running OS.
          path: |
            ~/.cabal/store
            C:\cabal\store
            dist-newstyle
          key: cabal-${{ matrix.name }}-ghc${{ steps.versions.outputs.ghc }}-${{ hashFiles('volca.cabal', 'mumps-hs/mumps-hs.cabal', 'cabal.project') }}-v2
          # Two-level fallback: same GHC first (object files reusable), then
          # any GHC for the same matrix entry (cabal will re-resolve and
          # rebuild the deps closure but reuse what it can – better than
          # full cold). Don't widen beyond matrix.name: cabal stores are not
          # cross-OS / cross-arch compatible.
          # Bumped to -v2: previous caches were built with cabal using XDG
          # paths, while we now force CABAL_DIR=~/.cabal – the dist-newstyle
          # plan would reference paths cabal can no longer resolve.
          restore-keys: |
            cabal-${{ matrix.name }}-ghc${{ steps.versions.outputs.ghc }}-${{ hashFiles('volca.cabal', 'mumps-hs/mumps-hs.cabal', 'cabal.project') }}-
            cabal-${{ matrix.name }}-ghc${{ steps.versions.outputs.ghc }}-
            cabal-${{ matrix.name }}-

      - name: Build and test
        if: needs.preflight.outputs.skip != 'true'
        # PR/smoke builds compile volca's own code at -O0 (gen-cabal-config.sh
        # turns this into a per-package override; deps stay -O2 so the prebuilt
        # store still matches). This row exists to run the suite: the suite
        # itself takes a few seconds longer unoptimised, against a compile it
        # waits on that is more than ten times shorter. Release builds keep
        # -O2, since the packaged binary is built in this very step, so the
        # level has to be right here.
        env:
          VOLCA_OPT_LEVEL: ${{ inputs.release && '2' || '0' }}
        run: |
          # Windows: re-source GHCup env in this MSYS2 shell since the wrapper
          # does not inherit PATH from the previous step.
          [[ -f /d/ghcup/env ]] && source /d/ghcup/env
          # The Linux rows run in an Alpine container that has no git when
          # checkout runs, so checkout falls back to the REST tarball and
          # leaves no .git behind: gen-version.sh found nothing to read and
          # every released Linux binary reported its commit as "unknown".
          # The runner knows what it checked out, and the script already
          # prefers these variables over git, so hand them over on every
          # platform rather than making one row special.
          export GIT_HASH="${GITHUB_SHA:0:7}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && export GIT_TAG="$GITHUB_REF_NAME"
          # Per-platform behaviour:
          # - Windows: only platform with indefinite test hangs
          #   (waitForProcess never reaping volca.exe). Wrap with GNU
          #   `timeout` (in MSYS2 coreutils) so a hang exits 124.
          # - macOS: UPX --force-macos rewrites the Mach-O header and the
          #   resulting binary will not exec on arm64 even after ad-hoc
          #   sign, so any test that spawns volca times out. Skip strip+UPX
          #   for the CI test run (the artifact is larger but usable).
          # - Linux: nothing special needed.
          # --werror on Linux only: -Wall-clean is a project rule, but only the
          # Linux compile is verified warning-free (it mirrors the local ci.sh
          # gate). Windows/macOS keep -Wall without -Werror so a platform-only
          # warning we can't yet reproduce doesn't block every merge; promote
          # them once each is confirmed clean.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            timeout --foreground 1500 ./build.sh --test
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ./build.sh --test --no-optimize
          else
            ./build.sh --test --werror
          fi

      - name: Show the test suite log
        # cabal prints "Test suite lca-tests: FAIL" and points at a log file
        # that stays on the runner, so a platform-only failure is otherwise
        # diagnosed by guesswork. Anything the suite wrote after the last
        # streamed line - an assertion, an RTS message, a signal - is in there.
        if: failure() && needs.preflight.outputs.skip != 'true'
        run: |
          # The link flags actually in force, not the ones the script meant to
          # write. Successive link changes produced byte-identical crash
          # addresses, which says the flags never reached the linker.
          echo "=== cabal.project.local ==="
          cat cabal.project.local || true
          find dist-newstyle -name '*lca-tests.log' -print -exec tail -n 100 {} \; || true
          # A suite that dies on a signal writes nothing at all, so the log
          # above ends mid-sentence and names no cause. Re-run the binary for
          # its exit status: 128+signal says which one, and 139 (SIGSEGV) in
          # particular is what a stack overrun in a BLAS kernel looks like.
          BIN=$(cabal list-bin lca-tests 2>/dev/null || true)
          if [[ -n "$BIN" && -x "$BIN" ]]; then
            "$BIN" >/dev/null 2>&1 || echo "test binary exit status: $?"
          fi
          # A signal names the kind of death, not the culprit. Run it under the
          # debugger and print every thread's stack from where it stopped.
          if [[ "$RUNNER_OS" == "macOS" && -n "$BIN" && -x "$BIN" ]] && command -v lldb >/dev/null; then
            # `image lookup` on the faulting address names the object file the
            # code came from, which is what says whether this is OpenBLAS,
            # MUMPS or our own code. The backtrace alone only gives a local
            # assembler label, which belongs to no library in particular.
            # -k, not -o: in batch mode the -o list stops at the signal and
            # only the -k commands run once the process has crashed. Passing
            # these as -o printed nothing but the stop message.
            lldb --batch -o run \
                 -k 'thread backtrace all' \
                 -k 'image lookup --address $pc --verbose' \
                 -k 'register read' \
                 -k quit -- "$BIN" 2>&1 | tail -n 160
          fi

      - name: Verify the Windows zip's ingredients are on the runner
        # The packaging step runs only under `release: true`, so without this
        # every PR would leave the Windows zip's contents untested and a broken
        # assumption would surface at tag time, blocking a release. Check here
        # everything packaging will reach for.
        if: needs.preflight.outputs.skip != 'true' && matrix.os == 'windows'
        run: |
          missing=""
          for dll in $WINDOWS_RUNTIME_DLLS; do
            if [[ ! -f "/ucrt64/bin/$dll" ]]; then
              missing="$missing $dll"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::MSYS2 no longer ships:$missing – the release zip would be missing runtime the binary loads."
            exit 1
          fi
          if [[ ! -d /ucrt64/share/licenses ]]; then
            echo "::error::/ucrt64/share/licenses missing – the release zip cannot carry the runtime DLLs' licence texts."
            exit 1
          fi
          echo "OK: every runtime DLL present, and $(find /ucrt64/share/licenses -type f | wc -l) licence file(s) available to ship."

      - name: Verify static MUMPS link (Linux)
        # Regression guard: the shipped tarball must not depend on
        # libdmumps_seq.so / libmumps_common_seq.so / libpord_seq.so /
        # libmpiseq_seq.so at runtime – end users would have to apt-install
        # libmumps-seq separately, which breaks the standalone-binary UX.
        # Catches the case where build-mumps.sh (or someone's local edit)
        # introduces dynamic MUMPS deps, including any future variant that
        # enables Scotch and ends up linking the system libscotch.so.
        if: needs.preflight.outputs.skip != 'true' && matrix.os == 'linux'
        run: |
          VOLCA_BIN=$(cabal list-bin exe:volca)
          # Decompress UPX wrapper so ldd can read the dynamic section
          # (UPX strips section headers; ldd otherwise reports
          # "not a dynamic executable" regardless of actual linkage).
          cp "$VOLCA_BIN" /tmp/volca-ldd-check
          upx -d /tmp/volca-ldd-check >/dev/null 2>&1 || true
          deps=$(ldd /tmp/volca-ldd-check 2>/dev/null | grep -E 'libdmumps_seq|libmumps_common_seq|libpord_seq|libmpiseq_seq|libscotch' || true)
          if [[ -n "$deps" ]]; then
            echo "::error::Binary has dynamic MUMPS/Scotch dependencies – static link regressed:"
            echo "$deps"
            exit 1
          fi
          echo "OK: no MUMPS shared library dependencies in the shipped binary."

      - name: Optimize macOS binary (strip + ad-hoc sign)
        # Tests above ran on the unstripped binary because UPX'd Mach-O on
        # arm64 is killed at fork by the kernel even after ad-hoc re-sign
        # (an upstream UPX 5.x / arm64 limitation – not something we can
        # work around). Now that tests are done, strip + re-sign the binary
        # so the uploaded artifact is meaningfully smaller. Then verify it
        # still launches before upload – if a future UPX path is re-enabled
        # in build.sh and breaks the binary, this catches it loudly.
        if: needs.preflight.outputs.skip != 'true' && matrix.os == 'macos'
        run: |
          ./build.sh --optimize-only
          VOLCA_BIN=$(cabal list-bin exe:volca)
          "$VOLCA_BIN" --version
          ls -lh "$VOLCA_BIN"

      - name: Verify standalone macOS binary
        # Regression guard, the macOS counterpart of the Linux ldd check above:
        # the shipped tarball must load on a Mac with no Homebrew. A binary
        # linked against /opt/homebrew (or /usr/local on Intel) aborts at dyld
        # with "Library not loaded", which `--version` on this runner cannot
        # catch – the build machine has the formulas installed.
        #
        # Only /usr/lib and /System/Library are guaranteed present on a stock
        # macOS, so anything else in LC_LOAD_DYLIB is a dependency the user
        # does not have.
        # arm64 only: macOS x86_64 still links OpenBLAS dynamically, so it would
        # fail this check by design. See the OpenBLAS step in
        # .github/actions/setup-haskell-env for why no recipe works there.
        if: needs.preflight.outputs.skip != 'true' && matrix.name == 'macos-arm64'
        run: |
          VOLCA_BIN=$(cabal list-bin exe:volca)
          # otool's first line is the binary's own path; drop it, keep the
          # indented load commands, and read the path before the ` (compat…`.
          foreign=$(otool -L "$VOLCA_BIN" | tail -n +2 | awk '{print $1}' \
            | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [[ -n "$foreign" ]]; then
            echo "::error::Binary depends on dylibs absent from a stock macOS – static link regressed:"
            echo "$foreign"
            exit 1
          fi
          echo "OK: no non-system dylib dependencies in the shipped binary."

      - name: Save MUMPS local build
        # Only save when build.sh actually ran a source build (i.e. neither
        # the prebuilt download nor the cache restore populated deps/mumps).
        # Without this gate we'd try to save the prebuilt download as if it
        # were a cache entry, which both wastes cycles and pollutes the
        # cache key namespace.
        if: |
          always() &&
          needs.preflight.outputs.skip != 'true' &&
          steps.download-mumps.outputs.populated != 'true' &&
          steps.cache-mumps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/mumps
          key: ${{ steps.cache-mumps.outputs.cache-primary-key }}

      - name: Save GHCup install (Linux/macOS)
        # always() so a downstream test or optimize failure doesn't discard
        # the GHC install we just paid 3–4 minutes for. The cold install
        # completes within the setup-haskell-env composite; if THAT fails
        # the workflow halts before this save runs anyway, so there's no
        # risk of caching a partial ~/.ghcup. (Contrast with the Windows
        # pattern, which is split across multiple steps and prefers the
        # safer no-always policy.)
        if: always() && needs.preflight.outputs.skip != 'true' && (matrix.os == 'linux' || matrix.os == 'macos') && steps.setup-haskell.outputs.ghcup-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ghcup
          key: ${{ steps.setup-haskell.outputs.ghcup-cache-key }}

      - name: Save Cabal store
        # Save even when the prebuilt download wins. Two reasons:
        #
        # 1. dist-newstyle (volca's own object files) is built fresh by
        #    every run and is in the cache path. Skipping Save means
        #    every same-hash PR rebuilds volca's own modules from
        #    scratch instead of incrementally – kills the "only
        #    recompile our own code" property.
        # 2. The cache also serves as fallback for PRs whose cabal
        #    config hash doesn't match any existing prebuilt release.
        #    Without saving on the prebuilt-win path, main's own runs
        #    leave no cache for those PRs to inherit.
        #
        # Skipping when an exact cache key already hit is still right –
        # actions/cache/save with an existing key is a no-op (logs a
        # warning) but we save the tar/upload work anyway.
        #
        # Key is inlined (not steps.cache-cabal.outputs.cache-primary-key)
        # because Restore Cabal store is skipped on the prebuilt-win path,
        # so its outputs are unset and we'd save with an empty key.
        if: always() && needs.preflight.outputs.skip != 'true' && steps.cache-cabal.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/store
            C:\cabal\store
            dist-newstyle
          key: cabal-${{ matrix.name }}-ghc${{ steps.versions.outputs.ghc }}-${{ hashFiles('volca.cabal', 'mumps-hs/mumps-hs.cabal', 'cabal.project') }}-v2

      - name: Package release tarball
        if: needs.preflight.outputs.skip != 'true' && inputs.release
        # Same `cabal list-bin` trick the macOS optimize step uses – handles
        # both opt/build and build paths regardless of optimization level.
        run: |
          [[ -f /d/ghcup/env ]] && source /d/ghcup/env
          VOLCA_BIN=$(cabal list-bin exe:volca)
          VERSION='${{ steps.cabal-version.outputs.version }}'
          NAME='${{ matrix.name }}'
          mkdir staging
          cp "$VOLCA_BIN" staging/
          # OpenBLAS is BSD-3, whose binary-redistribution clause asks for the
          # copyright notice to travel with the artifact – true on every platform,
          # statically linked or not. On Windows the file also covers the GCC
          # runtime DLLs copied below.
          cp THIRD-PARTY-LICENSES.md staging/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # volca.exe links the MSYS2 ucrt64 runtime dynamically (gen-cabal-config.sh's
            # windows mode). Those DLLs sit on the build machine's PATH but nowhere on a
            # user's, so a zip holding only volca.exe fails at load with
            # "libgfortran-5.dll introuvable". Ship them beside the binary – Windows
            # searches the .exe's own directory first. The per-PR check above has
            # already confirmed each one exists; re-checked here so an absence can
            # never turn into a silent partial zip.
            UCRT_BIN=""
            for candidate in /ucrt64/bin /c/msys64/ucrt64/bin; do
              if [[ -d "$candidate" ]]; then
                UCRT_BIN="$candidate"
                break
              fi
            done
            if [[ -z "$UCRT_BIN" ]]; then
              echo "::error::MSYS2 ucrt64 not found – cannot bundle the runtime DLLs the binary needs."
              exit 1
            fi
            for dll in $WINDOWS_RUNTIME_DLLS; do
              if [[ ! -f "$UCRT_BIN/$dll" ]]; then
                echo "::error::Required runtime DLL not found: $UCRT_BIN/$dll"
                exit 1
              fi
              cp "$UCRT_BIN/$dll" staging/
            done
            # GPLv3 asks for the licence text to travel with the binaries. MSYS2
            # installs each package's own texts under share/licenses, so copy those
            # rather than transcribing them into the repo and letting them rot.
            if [[ ! -d "$UCRT_BIN/../share/licenses" ]]; then
              echo "::error::$UCRT_BIN/../share/licenses missing – cannot ship the DLLs' licence texts."
              exit 1
            fi
            cp -r "$UCRT_BIN/../share/licenses" staging/licenses
            ARTIFACT="volca-${VERSION}-${NAME}.zip"
            # 7z is preinstalled on the Windows runner image but lives at
            # C:\Program Files\7-Zip\, which is on Windows' PATH but not on
            # MSYS2 bash's PATH (the shell this step runs under). Use the
            # absolute path explicitly.
            (cd staging && "/c/Program Files/7-Zip/7z.exe" a "../${ARTIFACT}" .)
          else
            ARTIFACT="volca-${VERSION}-${NAME}.tar.gz"
            tar -czf "${ARTIFACT}" -C staging .
          fi
          echo "ARTIFACT_PATH=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload binary (build mode)
        if: ${{ needs.preflight.outputs.skip != 'true' && !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: volca-${{ matrix.name }}
          # cabal names the penultimate segment after the optimization level:
          # `opt/build/` at 2, `build/` at 1, `noopt/build/` at 0. ** absorbs
          # all three. List the binary names explicitly, because a trailing
          # `volca*` glob also matches the sibling `volca-tmp/` build dir and
          # uploads its Main.hi/Main.o.
          path: |
            dist-newstyle/build/*/ghc-*/volca-*/x/volca/**/build/volca/volca
            dist-newstyle/build/*/ghc-*/volca-*/x/volca/**/build/volca/volca.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload tarball (release mode)
        if: needs.preflight.outputs.skip != 'true' && inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: volca-${{ matrix.name }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          # Short retention – release.yml's publish job downloads them
          # within minutes. They are also attached to the GH Release as
          # the durable copy.
          retention-days: 7
