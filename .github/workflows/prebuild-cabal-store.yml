name: Prebuild cabal store

# Manual workflow that builds every external Haskell dep once per
# (volca.cabal + cabal.project, GHC_VERSION, CABAL_PREBUILT_REVISION) tuple
# and attaches each platform's
# ~/.cabal/store as a tarball to a GH Release tagged
# `cabal-store-prebuilt-ghc${GHC_VERSION}-${HASH8}-r${REV}`.
#
# `_build-matrix.yml` then downloads from that release in ~30 s instead
# of compiling deps from scratch (10–20 min cold) on every CI run.
#
# Trigger after:
#   * Bumping a Haskell dep version in volca.cabal / cabal.project – the
#     hash changes, so the new tag is a separate release; older branches
#     still resolve to the previous prebuilt.
#   * Bumping GHC_VERSION in versions.env (different tag).
#   * Bumping CABAL_PREBUILT_REVISION (forces rebuild at the same hash+GHC,
#     e.g. after a runner-image update changes glibc and binaries no
#     longer load).

on:
  workflow_dispatch:

jobs:
  # Read toolchain pins once; downstream jobs reference needs.versions.outputs.*.
  # See _build-matrix.yml for the rationale.
  versions:
    name: Read pinned versions
    runs-on: ubuntu-latest
    outputs:
      alpine: ${{ steps.r.outputs.alpine }}
      macos_target: ${{ steps.r.outputs.macos_target }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          source versions.env
          echo "alpine=alpine:$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "macos_target=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.runner }}
    # Linux jobs prebuild the cabal store in Alpine so the cached
    # ~/.cabal/store is linked against musl libc – matches what
    # _build-matrix.yml consumes. See _build-matrix.yml for context.
    container: ${{ matrix.os == 'linux' && needs.versions.outputs.alpine || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            os: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - name: windows-amd64
            runner: windows-latest
            os: windows
          - name: macos-arm64
            runner: macos-15
            os: macos
          # Intel macOS – GitHub's last x86_64 hosted label (retires Aug 2027).
          - name: macos-intel
            runner: macos-15-intel
            os: macos
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ needs.versions.outputs.macos_target }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      # See _build-matrix.yml for context: GH's JS actions need a glibc Node
      # and won't run in Alpine arm64 without this gcompat + os-release mask.
      - if: matrix.os == 'linux'
        uses: laverdet/alpine-arm64@v1
      - uses: actions/checkout@v4

      # POSIX `sh` here – bash isn't preinstalled in the Alpine container
      # we now use for Linux jobs (setup-haskell-env apk-installs it below).
      - name: Read pinned versions
        id: versions
        shell: sh
        run: |
          # See _build-matrix.yml: `./` keeps dash from PATH-searching.
          . ./versions.env
          echo "ghc=$GHC_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Haskell build environment
        uses: ./.github/actions/setup-haskell-env
        with:
          matrix-os: ${{ matrix.os }}
          matrix-name: ${{ matrix.name }}
          ghc-version: ${{ steps.versions.outputs.ghc }}
          # Prebuild workflows run on manual dispatch only; no UPX (we
          # ship the cabal store, not a binary) and no GHCup cache (the
          # ~10-min savings don't matter when we run this maybe once
          # per cabal-deps bump).

      - name: Generate cabal.project.local
        run: |
          # Mirror build.sh's per-platform LINK_MODE selection.
          [[ -f /d/ghcup/env ]] && source /d/ghcup/env
          case "$RUNNER_OS" in
            Windows) export LINK_MODE=windows ;;
            macOS)   export LINK_MODE=darwin  ;;
            *)       export LINK_MODE=musl    ;;
          esac
          ./gen-cabal-config.sh
          echo "--- cabal.project.local ---"
          cat cabal.project.local

      - name: Build cabal deps
        run: |
          [[ -f /d/ghcup/env ]] && source /d/ghcup/env
          cabal update
          cabal build --only-dependencies --enable-tests all

      - name: Package cabal store
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            STORE_PARENT='/c/cabal'
          else
            STORE_PARENT="$HOME/.cabal"
          fi
          test -d "$STORE_PARENT/store"
          tar -czf "cabal-store-${{ matrix.name }}.tar.gz" -C "$STORE_PARENT" store
          ls -lh "cabal-store-${{ matrix.name }}.tar.gz"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: cabal-store-${{ matrix.name }}
          path: cabal-store-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish prebuilt release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versions + cabal hash
        id: meta
        # Hash inputs identical to _build-matrix.yml's cabal-store probe, so
        # content change there always implies a new prebuilt. version/synopsis/
        # description are stripped from volca.cabal – they don't affect deps,
        # so a release bump reuses the store. Keep this filter byte-identical
        # to the one in _build-matrix.yml.
        shell: bash
        run: |
          source versions.env
          echo "ghc=$GHC_VERSION" >> "$GITHUB_OUTPUT"
          echo "rev=${CABAL_PREBUILT_REVISION:-1}" >> "$GITHUB_OUTPUT"
          echo "hash=$( { grep -vE '^(version|synopsis|description):' volca.cabal; cat cabal.project; } | sha256sum | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/publish-prebuilt-release
        with:
          tag: cabal-store-prebuilt-ghc${{ steps.meta.outputs.ghc }}-${{ steps.meta.outputs.hash }}-r${{ steps.meta.outputs.rev }}
          title: Cabal store prebuilt – GHC ${{ steps.meta.outputs.ghc }}, hash ${{ steps.meta.outputs.hash }} (revision ${{ steps.meta.outputs.rev }})
          notes: Prebuilt cabal store (~/.cabal/store) for use by _build-matrix.yml. Hash ${{ steps.meta.outputs.hash }} = first 8 chars of sha256(volca.cabal + cabal.project).
          asset-glob: cabal-store-*.tar.gz
          bump-hint: CABAL_PREBUILT_REVISION
          github-token: ${{ secrets.GITHUB_TOKEN }}
