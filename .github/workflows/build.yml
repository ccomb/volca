name: Build

# Slim wrapper around the reusable _build-matrix.yml. Triggers:
#   - pull_request to main: gate merges on a green 4-platform build
#   - push to main: re-populate actions/cache after squash-merge so that
#     subsequent PRs have a default-branch cache to fall back to. Without
#     this, PR runs save caches scoped to the (then-deleted) PR branch
#     and main has nothing for new PRs to inherit. The cabal-store
#     prebuilt usually masks this, but only when its hash matches; cache
#     fallback is what catches the hash-changed case.
#
# Pyvolca-only PRs short-circuit inside _build-matrix.yml: a preflight
# job detects a pyvolca-only diff and every matrix step no-ops, so the
# four required `build / *` checks still report success without burning
# the ~30 min cold-cabal compile. (A `paths-ignore: pyvolca/**` here
# would skip the workflow entirely, leaving the required checks pending
# forever – branch protection treats missing required checks as blocked.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any older in-flight runs for the same PR when a new commit is
# pushed. Keeps queue depth bounded – Windows cold builds are 30 min
# and there is no point burning runners on superseded code.
concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-matrix.yml
    with:
      release: false

  # data/VERSION is the bundle's identity (the asset name, the install
  # directory, the dataVersion an engine reports), so a PR that changes
  # data/ has to move it. Cheap and build-independent, so it runs beside
  # the matrix and the PR shows the mismatch at once.
  data-version:
    name: data/VERSION follows data/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: scripts/check-data-version.sh

  # THIRD_PARTY_LICENSES.md is the license inventory /api/v1/licenses points
  # readers at, and it is written by hand, so a dependency added or removed
  # leaves it wrong with nothing failing. Same shape as the check above:
  # no build needed, the PR shows the mismatch at once.
  licenses-table:
    name: THIRD_PARTY_LICENSES.md follows volca.cabal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-licenses-table.sh
