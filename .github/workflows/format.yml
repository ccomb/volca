name: Format

# Gate PRs on fourmolu formatting. Fast, build-independent – runs in parallel
# with the heavy build matrix rather than after it. fourmolu version comes from
# versions.env so CI, the .githooks/pre-commit hook, and Claude Code's
# PostToolUse hook all format identically.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: format-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fourmolu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin fourmolu version from versions.env
        run: grep -E '^FOURMOLU_VERSION=' versions.env >> "$GITHUB_ENV"
      - uses: haskell-actions/run-fourmolu@v12
        with:
          version: ${{ env.FOURMOLU_VERSION }}
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs

  # The same gate for the solver's Rust, format and lints, under the Rust that
  # versions.env pins: both change what they ask for between versions.
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust
        run: |
          source versions.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
      - run: cargo fmt --manifest-path solver/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path solver/Cargo.toml --all-targets -- -D warnings
