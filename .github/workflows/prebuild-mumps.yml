name: Prebuild MUMPS

# Manual workflow that builds MUMPS once per
# (MUMPS_VERSION, MUMPS_PREBUILT_REVISION) tuple and attaches the result
# to a GH Release tagged `mumps-prebuilt-<version>-r<rev>`. Subsequent
# normal CI runs (`_build-matrix.yml`) then download from that release
# instead of compiling MUMPS from source – eliminating the 8–17 minute
# cold-cache MUMPS compile from every PR/release run.
#
# When to trigger:
#   * After bumping MUMPS_VERSION in versions.env
#   * After editing build-mumps.sh (also bump MUMPS_PREBUILT_REVISION
#     so the new build replaces the previous cached one)
#
# The release tag is derived from versions.env, so the same revision
# cannot be uploaded twice – re-running on an existing tag fails fast
# in the publish job.

on:
  workflow_dispatch:

jobs:
  # Read toolchain pins once; downstream jobs reference needs.versions.outputs.*.
  # See _build-matrix.yml for the rationale.
  versions:
    name: Read pinned versions
    runs-on: ubuntu-latest
    outputs:
      alpine: ${{ steps.r.outputs.alpine }}
      macos_target: ${{ steps.r.outputs.macos_target }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          source versions.env
          echo "alpine=alpine:$ALPINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "macos_target=$MACOSX_DEPLOYMENT_TARGET" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: versions
    runs-on: ${{ matrix.runner }}
    # Linux jobs build MUMPS in Alpine so the archive is musl-compatible
    # (no glibc symbols leaking into libdmumps_seq.a). See _build-matrix.yml
    # for the wider context. Windows/macOS keep running on the bare runner.
    container: ${{ matrix.os == 'linux' && needs.versions.outputs.alpine || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            os: linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
          - name: windows-amd64
            runner: windows-latest
            os: windows
          - name: macos-arm64
            runner: macos-15
            os: macos
          # Intel macOS – GitHub's last x86_64 hosted label (retires Aug 2027).
          - name: macos-intel
            runner: macos-15-intel
            os: macos
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ needs.versions.outputs.macos_target }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
    steps:
      # See _build-matrix.yml for context: GH's JS actions need a glibc Node
      # and won't run in Alpine arm64 without this gcompat + os-release mask.
      - if: matrix.os == 'linux'
        uses: laverdet/alpine-arm64@v1
      - uses: actions/checkout@v4

      - name: Setup build environment (no GHC)
        uses: ./.github/actions/setup-haskell-env
        with:
          matrix-os: ${{ matrix.os }}
          matrix-name: ${{ matrix.name }}
          # ghc-version='' skips every Cabal/GHC/OpenBLAS step – we
          # only build the MUMPS solver here, never invoke cabal.

      - name: Read pinned MUMPS version
        id: versions
        shell: bash
        run: |
          source versions.env
          echo "mumps=$MUMPS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build MUMPS
        env:
          MUMPS_VERSION: ${{ steps.versions.outputs.mumps }}
        run: |
          # Per-platform BLAS hints – mirror what build.sh chooses for the
          # source-build fallback path so the prebuilt archives are bit-for-bit
          # what an in-CI source build would produce.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export BLAS_LIBS="-lopenblas"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            OPENBLAS_PREFIX="$(brew --prefix openblas)"
            export BLAS_LIBS="-L${OPENBLAS_PREFIX}/lib -lopenblas"
            export CPPFLAGS="-I${OPENBLAS_PREFIX}/include"
          fi
          ./build-mumps.sh

      - name: Package
        shell: bash
        run: |
          test -f deps/mumps/lib/libdmumps_seq.a
          tar -czf "mumps-prebuilt-${{ matrix.name }}.tar.gz" -C deps mumps
          ls -lh "mumps-prebuilt-${{ matrix.name }}.tar.gz"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: mumps-prebuilt-${{ matrix.name }}
          path: mumps-prebuilt-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish prebuilt release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned versions
        id: v
        run: |
          source versions.env
          echo "mumps=$MUMPS_VERSION" >> "$GITHUB_OUTPUT"
          echo "rev=${MUMPS_PREBUILT_REVISION:-1}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/publish-prebuilt-release
        with:
          tag: mumps-prebuilt-${{ steps.v.outputs.mumps }}-r${{ steps.v.outputs.rev }}
          title: MUMPS ${{ steps.v.outputs.mumps }} prebuilt (revision ${{ steps.v.outputs.rev }})
          notes: "Prebuilt MUMPS_SEQ ${{ steps.v.outputs.mumps }} (PORD ordering, double precision, static archives) for use by _build-matrix.yml. Source: build-mumps.sh."
          asset-glob: mumps-prebuilt-*.tar.gz
          bump-hint: MUMPS_PREBUILT_REVISION
          github-token: ${{ secrets.GITHUB_TOKEN }}
