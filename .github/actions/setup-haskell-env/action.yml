name: Setup Haskell build environment
description: MSYS2/apt/brew toolchain + GHCup install (with optional cache restore on Unix). Caller adds the matching cache-save step - composite actions cannot defer steps until after the caller's downstream work.

inputs:
  matrix-os:      { required: true,  description: linux | windows | macos }
  matrix-name:    { required: true,  description: matrix entry name (e.g. linux-amd64), used in the GHCup cache key }
  ghc-version:    { required: false, default: '',     description: GHC version to install. Empty skips every Cabal/GHC/OpenBLAS step (used by the MUMPS-only prebuild). }
  install-upx:    { required: false, default: 'false', description: Install UPX for binary compression. }
  cache-ghcup:    { required: false, default: 'false', description: Restore GHCup install from actions/cache on Linux/macOS. }

outputs:
  ghcup-cache-hit: { description: Output of actions/cache/restore - empty when cache-ghcup is false. , value: "${{ steps.cache.outputs.cache-hit }}" }
  ghcup-cache-key: { description: Primary cache key for the matching save step.,                     value: "${{ steps.cache.outputs.cache-primary-key }}" }

runs:
  using: composite
  steps:
    - name: Setup MSYS2 (Windows)
      if: inputs.matrix-os == 'windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-gcc-fortran
          mingw-w64-ucrt-x86_64-openblas
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-make
          ${{ inputs.install-upx == 'true' && 'mingw-w64-ucrt-x86_64-python' || '' }}
          ${{ inputs.install-upx == 'true' && 'mingw-w64-ucrt-x86_64-upx' || '' }}
          make python git curl tar

    # C:\cabal -> D:\cabal junction. C: is a slow Azure managed disk
    # (~4k IOPS); D: is local temp (~83k IOPS). Junction (vs. CABAL_DIR
    # override) keeps the prebuilt cabal-store tarball working unchanged
    # - its .conf files have absolute C:\cabal\store\... paths baked in.
    - name: Redirect C:\cabal to D:\cabal (Windows)
      if: inputs.matrix-os == 'windows' && inputs.ghc-version != ''
      shell: cmd
      run: |
        if exist C:\cabal rmdir /s /q C:\cabal
        mkdir D:\cabal
        mklink /J C:\cabal D:\cabal

    # GHCup on Windows installs fresh into D:\ghcup every run: caching
    # C:\ghcup took ~26 min to save (tar + zstd + upload of ~2.5 GB
    # of small NTFS files) vs. ~2 min to reinstall.
    - name: Install GHC via ghcup (Windows)
      if: inputs.matrix-os == 'windows' && inputs.ghc-version != ''
      shell: 'msys2 {0}'
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
          | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 \
            BOOTSTRAP_HASKELL_GHC_VERSION=${{ inputs.ghc-version }} \
            BOOTSTRAP_HASKELL_INSTALL_NO_STACK=1 \
            GHCUP_INSTALL_BASE_PREFIX=/d \
            sh
        # MSYS2's CMD wrapper does not propagate GITHUB_PATH, so later
        # steps in the calling workflow re-source /d/ghcup/env themselves.
        source /d/ghcup/env
        ghc --version && cabal --version && cabal update

    # Alpine containers run as root and have no apt/sudo - install everything
    # via apk. Mirrors the package list from docker/Dockerfile.musl, the only
    # other place we build volca against musl. `*-static` packages ship the
    # .a variants required by `executable-static`. github-cli is needed for
    # the workflow's `gh release download` steps.
    #
    # IMPORTANT ordering invariant: this step installs bash on the Alpine
    # image. Every later step on the musl path uses `shell: bash`; this
    # step itself must use `shell: sh` (bash isn't there yet). Do not reorder.
    - name: Install build dependencies (Linux musl)
      if: inputs.matrix-os == 'linux'
      shell: sh
      run: |
        apk add --no-cache \
          bash coreutils binutils curl file git tar xz perl python3 make cmake pkgconfig \
          linux-headers musl-dev libc-dev \
          gcc g++ gfortran \
          gmp-dev gmp-static libffi-dev \
          ncurses-dev ncurses-static \
          zlib-dev zlib-static \
          zstd-dev zstd-static \
          xz-dev xz-static \
          github-cli \
          ${{ inputs.install-upx == 'true' && 'upx' || '' }}

    # Ordering invariant, the macOS mirror of the Alpine one above: this brings
    # in gfortran, which the OpenBLAS source build below needs to compile
    # LAPACK. Do not move it after that step.
    #
    # The openblas formula is not what the engine links against - that is the
    # source build below. It is still needed for the MUMPS source-build
    # fallback, which build.sh points at the Homebrew copy when no prebuilt
    # MUMPS archive is available.
    - name: Install build dependencies (macOS)
      if: inputs.matrix-os == 'macos'
      shell: bash
      run: brew install gcc openblas ${{ inputs.install-upx == 'true' && 'upx' || '' }}

    # Not on macOS x86_64, where neither recipe produces a working library and
    # the leg keeps its dynamic link to Homebrew. DYNAMIC_ARCH pulls in the
    # older x86_64 kernels, 18 of which hard-code `.align 32768`; Mach-O caps
    # section alignment at 4 KB, so ld64 quietly reduces it and the first BLAS
    # call takes SIGBUS. Naming one TARGET drops those kernels and the warning
    # with them, but then OpenBLAS's own unit tests return denormals for
    # `min()`, which is a defect we have not explained. Both are upstream
    # ground. Linux links the same DYNAMIC_ARCH archive without complaint - ELF
    # honours the alignment Mach-O refuses.
    #
    # OpenBLAS source-build, Linux and macOS arm64 alike. Both need it, for reasons
    # that meet in the same place: Alpine's lapack-dev / blas-dev ship .so only,
    # so a static link can't resolve -llapack / -lblas; and Homebrew's
    # libopenblas.a is the OpenMP variant, which leaves __kmpc_* / omp_*
    # undefined unless libomp is linked too - a dependency the dylib used to
    # carry silently and a static link cannot. USE_OPENMP=0 removes the question
    # rather than answering it: OpenBLAS threads through pthreads instead.
    # OpenBLAS bundles both BLAS and LAPACK into a single libopenblas.a - one
    # source build replaces both. Knobs match docker/Dockerfile.musl so the CI
    # binary is bit-for-bit comparable to the Docker image one.
    #
    # Cached on (matrix-name, OPENBLAS_VERSION) so an unchanged version
    # reuses the previous build in ~5 s instead of compiling for ~8 min.
    # Cache invalidates automatically on every versions.env edit, and on every
    # edit to this file - the make flags below decide what is in the archive,
    # so a recipe change that kept the old key would restore a library built
    # under the previous one and quietly test nothing.
    - name: Restore OpenBLAS build
      if: (inputs.matrix-os == 'linux' || inputs.matrix-name == 'macos-arm64') && inputs.ghc-version != ''
      id: cache-openblas
      uses: actions/cache@v4
      with:
        path: deps/openblas
        key: openblas-${{ inputs.matrix-name }}-${{ hashFiles('versions.env', '.github/actions/setup-haskell-env/action.yml') }}-v1

    - name: Build OpenBLAS
      if: (inputs.matrix-os == 'linux' || inputs.matrix-name == 'macos-arm64') && inputs.ghc-version != '' && steps.cache-openblas.outputs.cache-hit != 'true'
      shell: bash
      run: |
        source versions.env
        SRC="/tmp/OpenBLAS-${OPENBLAS_VERSION}"
        curl -fsSL "https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}.tar.gz" \
          | tar -xz -C /tmp
        cd "$SRC"
        # OpenBLAS's default target builds its own test suite, which links
        # -lgfortran. On macOS that lives in the Homebrew gcc prefix, which
        # clang does not search, so the tests fail to link even though the
        # library built fine. Ask the driver where it is rather than guessing
        # the Cellar layout. Keeping the tests is worth the one line: they
        # exercise the very archive we ship.
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          LIBRARY_PATH="$(dirname "$(gfortran -print-file-name=libgfortran.dylib)")${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export LIBRARY_PATH
        fi
        # DYNAMIC_ARCH ships every kernel set and picks one for the CPU it finds,
        # which is what a downloaded binary needs: one build has to run on every
        # machine, not on the one that built it.
        #
        # getconf rather than nproc: BusyBox Alpine and macOS both answer it.
        make -j"$(getconf _NPROCESSORS_ONLN)" \
          NO_SHARED=1 \
          USE_THREAD=1 USE_OPENMP=0 \
          DYNAMIC_ARCH=1 TARGET=GENERIC
        make PREFIX="$GITHUB_WORKSPACE/deps/openblas" NO_SHARED=1 install
        rm -rf "$SRC"

    - name: Export OpenBLAS paths
      if: (inputs.matrix-os == 'linux' || inputs.matrix-name == 'macos-arm64') && inputs.ghc-version != ''
      shell: sh
      run: |
        echo "OPENBLAS_LIB_DIR=$GITHUB_WORKSPACE/deps/openblas/lib" >> "$GITHUB_ENV"
        echo "OPENBLAS_INCLUDE_DIR=$GITHUB_WORKSPACE/deps/openblas/include" >> "$GITHUB_ENV"

    - name: Restore GHCup cache (Linux/macOS)
      id: cache
      if: (inputs.matrix-os == 'linux' || inputs.matrix-os == 'macos') && inputs.ghc-version != '' && inputs.cache-ghcup == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.ghcup
        # -v5: the saved tree is now slimmed (see the trim at the end of the
        # install step). Old -v4 snapshots are the full ~2-3 GB tree whose
        # restore times out on macOS - bumping forces a fresh lean save.
        key: ghcup-${{ inputs.matrix-name }}-ghc${{ inputs.ghc-version }}-v5

    # Bootstrap or restore GHCup into ~/.ghcup. We avoid haskell-actions/setup
    # because it symlinks to the runner's preinstalled /usr/local/.ghcup,
    # leaving ~/.ghcup empty of cacheable bytes. We also wipe the runner's
    # façade ~/.ghcup symlinks before install - otherwise tar archives the
    # ~200-byte symlink shells, not the targets. GHCUP_INSTALL_BASE_PREFIX
    # override pins install to ~/.ghcup (runner image defaults it to
    # /usr/local globally) and is also needed for `ghcup set` on warm runs.
    - name: Install GHC + Cabal via ghcup (Linux/macOS)
      if: (inputs.matrix-os == 'linux' || inputs.matrix-os == 'macos') && inputs.ghc-version != ''
      shell: bash
      env:
        GHC_VER: ${{ inputs.ghc-version }}
      run: |
        export GHCUP_INSTALL_BASE_PREFIX="$HOME"
        # Pin CABAL_DIR=~/.cabal so legacy paths win regardless of
        # cabal version / runner-image XDG defaults - otherwise ubuntu's
        # pre-created ~/.config/cabal/config redirects the store under
        # XDG_STATE_HOME and the cached ~/.cabal/store gets bypassed.
        # Both `export` (for the cabal commands later in this step) and
        # `>> $GITHUB_ENV` (for subsequent workflow steps) are needed:
        # GITHUB_ENV writes don't take effect until the next step.
        export CABAL_DIR="$HOME/.cabal"
        echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
        if [[ -d "$HOME/.ghcup/ghc/$GHC_VER" ]]; then
          # Warm: re-assert the bare `ghc` symlink in case the snapshot
          # was taken with another version active.
          "$HOME/.ghcup/bin/ghcup" set ghc "$GHC_VER"
        else
          rm -rf "$HOME/.ghcup"
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org \
            | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 \
              BOOTSTRAP_HASKELL_GHC_VERSION="$GHC_VER" \
              BOOTSTRAP_HASKELL_INSTALL_NO_STACK=1 \
              BOOTSTRAP_HASKELL_ADJUST_BASHRC=no \
              GHCUP_INSTALL_BASE_PREFIX="$HOME" \
              sh
          [[ -x "$HOME/.ghcup/bin/ghc-$GHC_VER" ]] || {
            echo "::error::ghcup did not install GHC $GHC_VER to ~/.ghcup as expected"
            exit 1
          }
        fi
        echo "$HOME/.ghcup/bin" >> "$GITHUB_PATH"
        "$HOME/.ghcup/bin/ghc" --numeric-version
        # ~/.cabal/packages (Hackage index) lives outside ~/.ghcup, so
        # always refresh - cold installs need it, warm runs need a
        # current view for the solver.
        "$HOME/.ghcup/bin/cabal" update
        # Slim ~/.ghcup before the caller caches it. The full tree (~2-3 GB,
        # tens of thousands of small files) was overflowing the actions/cache
        # macOS restore timeout, so every run fell back to a cold 4-5 min GHC
        # reinstall - defeating the cache entirely. None of the removed bytes
        # are needed to *build* a non-profiled binary:
        #   cache/   ghcup's downloaded install tarballs (already unpacked)
        #   tmp/     leftover unpack scratch dirs
        #   share/doc GHC's bundled HTML/PDF documentation
        #   *.p_o / *_p.a  profiling objects/libs (CI never builds profiled)
        # Runs on warm restores too - a near-noop, since the saved tree is
        # already slim. Best-effort: missing paths must not fail the build.
        rm -rf "$HOME/.ghcup/cache" "$HOME/.ghcup/tmp" || true
        rm -rf "$HOME/.ghcup/ghc/$GHC_VER/share/doc" || true
        find "$HOME/.ghcup/ghc/$GHC_VER" \( -name '*.p_o' -o -name '*_p.a' \) -delete 2>/dev/null || true
